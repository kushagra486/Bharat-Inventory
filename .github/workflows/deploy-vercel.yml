name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - claude/web-app-vercel-github-deploy-5rokim
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          vercel deploy \
            --token="$VERCEL_TOKEN" \
            --prod \
            --yes \
            --build-env EXPO_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
            --build-env EXPO_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
